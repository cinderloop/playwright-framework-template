# Brings up Practice Software Testing (Toolshop) for local and CI test runs.
# Based on the upstream docker-compose.prod.yml:
# https://github.com/testsmith-io/practice-software-testing
#
#   npm run toolshop:start  # up + seed: what you normally want
#   npm run toolshop:up     # start containers and wait until all are healthy
#   npm run toolshop:seed   # migrate:fresh --seed (resets all data)
#   npm run toolshop:down   # stop and remove containers + volumes
#
# UI:  http://localhost:4200
# API: http://localhost:8091
#
# Images are pinned by digest so every run tests the same Toolshop build.
# Upstream publishes only `latest`; bump the digests deliberately.
name: toolshop

services:
  laravel-api:
    # Sprint 5 API, linux/amd64 only (runs under emulation on Apple Silicon).
    image: testsmith/practice-software-testing-sprint5-api@sha256:881cb7ecd76477994728648c0c16f6e9d2beed0f0217734843a32a7bb92553f0
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
      # The image defaults to the file cache, where every product/category/brand
      # write flushes the whole store, including the cached auth user. Under
      # parallel tests that makes valid tokens intermittently fail with 401.
      # Redis supports cache tags, so writes flush only product entries.
      - CACHE_DRIVER=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  angular-ui:
    # Sprint 5 UI, linux/amd64 only.
    image: testsmith/practice-software-testing-sprint5-ui@sha256:f907d8daae32dc90ba900e964928d00bf0aabfab7067eaeeaa49f5a0f70c52e6
    ports:
      - '4200:4200'
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
    # ng serve compiles on start-up (1-3 min); healthy once it serves the app.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4200').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  web:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - '8091:80'
    volumes:
      - ./docker/nginx/toolshop-api.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel-app-code:/var/www:ro
    depends_on:
      - laravel-api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/status']
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11@sha256:8bb25ca2d68c81118fcf745959560de2f316a178abf9decc8bb5b6f86c929084
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  laravel-app-code:
