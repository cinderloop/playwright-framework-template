# Brings up Practice Software Testing (Toolshop) from its prebuilt images.
# Based on the upstream docker-compose.prod.yml:
# https://github.com/testsmith-io/practice-software-testing
#
#   npm run toolshop:start  # up + seed: what you normally want
#   npm run toolshop:up     # start containers and wait until all are healthy
#   npm run toolshop:seed   # migrate:fresh --seed (resets all data)
#   npm run toolshop:down   # stop and remove containers + volumes
#
# UI:  http://localhost:4200
# API: http://localhost:8091
name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-${TOOLSHOP_SPRINT:-sprint5}-api
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      mariadb:
        condition: service_healthy

  angular-ui:
    image: testsmith/practice-software-testing-${TOOLSHOP_SPRINT:-sprint5}-ui
    ports:
      - '4200:4200'
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
    # ng serve compiles on start-up (1-3 min); healthy once it serves the app.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4200').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  web:
    image: testsmith/practice-software-testing-web
    ports:
      - '8091:80'
    depends_on:
      - laravel-api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/status']
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  laravel-app-code:
