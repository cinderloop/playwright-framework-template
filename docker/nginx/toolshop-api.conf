# Fronts the Toolshop Laravel API (php-fpm in the laravel-api container).
# Replaces the upstream arm64-only web image so the stack runs natively on
# x64 CI runners as well as Apple Silicon.
server {
    listen 80;
    root /var/www/public;
    index index.php;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    # Server-sent events: pass through unbuffered.
    location = /sales-stream {
        include fastcgi_params;
        fastcgi_pass laravel-api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
