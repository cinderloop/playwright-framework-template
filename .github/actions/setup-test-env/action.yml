name: Set up test environment
description: >
  Installs Node.js and npm dependencies (npm cache), and optionally Playwright
  browsers (browser cache keyed on the exact Playwright version).

inputs:
  browsers:
    description: Space-separated browsers to install, e.g. "chromium firefox". Empty installs none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Resolve Playwright version
      if: inputs.browsers != ''
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    # Browser binaries are cached; OS packages cannot be, so they are installed on every run.
    - name: Cache Playwright browsers
      if: inputs.browsers != ''
      id: browser-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}

    - name: Install Playwright browsers and OS dependencies
      if: inputs.browsers != '' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install --with-deps $BROWSERS

    - name: Install Playwright OS dependencies
      if: inputs.browsers != '' && steps.browser-cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: npx playwright install-deps $BROWSERS
