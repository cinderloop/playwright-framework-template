name: Nightly

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Full suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_ENV: local
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-test-env
        with:
          browsers: chromium firefox webkit

      - uses: ./.github/actions/start-toolshop

      # Visual tests run in the Playwright image and quarantined tests in their own
      # non-blocking job (both below), not in the shards.
      - name: Run tests
        run: >-
          npx playwright test --grep-invert "@visual|@quarantine"
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - name: Toolshop logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop Toolshop
        if: always()
        run: npm run toolshop:down

  visual:
    name: Visual regression (Playwright image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_ENV: local
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-test-env

      - uses: ./.github/actions/start-toolshop

      - name: Build test image
        run: npm run docker:build

      # Baselines are only valid in this image; it reaches Toolshop over the host network.
      - name: Run visual tests
        run: >-
          docker run --rm --network host
          -e TEST_ENV -e CUSTOMER_EMAIL -e CUSTOMER_PASSWORD -e ADMIN_EMAIL -e ADMIN_PASSWORD
          -v "$PWD/blob-report:/tests/blob-report"
          -v "$PWD/test-results:/tests/test-results"
          toolshop-tests --project=visual

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-visual
          path: blob-report/
          retention-days: 3

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-visual
          path: test-results/
          retention-days: 14

      - name: Toolshop logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop Toolshop
        if: always()
        run: npm run toolshop:down

  quarantine:
    name: Quarantined tests (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Results are tracked in the report and job summary; failures do not fail the run.
    continue-on-error: true
    env:
      TEST_ENV: local
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-test-env
        with:
          browsers: chromium firefox webkit

      - uses: ./.github/actions/start-toolshop

      - name: Run @quarantine tests
        run: npx playwright test --grep @quarantine --grep-invert @visual --pass-with-no-tests

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-quarantine
          path: blob-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop Toolshop
        if: always()
        run: npm run toolshop:down

  report:
    name: Merge reports
    needs: [test, visual, quarantine]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-test-env

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        # merge.config.ts reconciles test paths from the runner and the Docker image,
        # and adds the flaky/quarantine summary to this job's summary page.
        run: npx playwright merge-reports -c merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playwright-report/

  deploy-report:
    name: Publish report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
